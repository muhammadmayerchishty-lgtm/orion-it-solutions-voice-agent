<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Main glass ring 3D gradient (Blue to Violet) -->
    <linearGradient id="orionRingGrad" x1="28" y1="36" x2="208" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3E82FF" />
      <stop offset="45%" stop-color="#2F6BFF" />
      <stop offset="100%" stop-color="#7B4DFF" />
    </linearGradient>

    <!-- Inner specular rim highlight -->
    <linearGradient id="orionRingHighlight" x1="24" y1="24" x2="180" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8D4FF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#588BFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#9A75FF" stop-opacity="0.75" />
    </linearGradient>

    <!-- Diagonal axis line gradient -->
    <linearGradient id="orionBeltLine" x1="78" y1="162" x2="162" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F6BFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#F2B84B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2F6BFF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Gold star 3D sphere radial gradient -->
    <radialGradient id="goldStarSphere" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="35%" stop-color="#F6C458" />
      <stop offset="75%" stop-color="#D98B19" />
      <stop offset="100%" stop-color="#8C5105" />
    </radialGradient>

    <!-- Gold ambient aura -->
    <radialGradient id="goldStarAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2B84B" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#F2B84B" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#F2B84B" stop-opacity="0" />
    </radialGradient>

    <!-- Blue star 3D sphere radial gradient -->
    <radialGradient id="blueStarSphere" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#D9E8FF" />
      <stop offset="38%" stop-color="#4E8BFF" />
      <stop offset="78%" stop-color="#1E4FD8" />
      <stop offset="100%" stop-color="#0D2575" />
    </radialGradient>

    <!-- Blue ambient aura -->
    <radialGradient id="blueStarAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F6BFF" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#2F6BFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2F6BFF" stop-opacity="0" />
    </radialGradient>

    <!-- Soft drop glow for the ring -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient glows behind the 3 belt stars -->
  <circle cx="80" cy="158" r="24" fill="url(#blueStarAura)" />
  <circle cx="160" cy="82" r="24" fill="url(#blueStarAura)" />
  <circle cx="120" cy="120" r="38" fill="url(#goldStarAura)" />

  <!-- Diagonal constellation line connecting the 3 Orion-belt stars -->
  <line
    x1="80"
    y1="158"
    x2="160"
    y2="82"
    stroke="url(#orionBeltLine)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Outer 3D Glass Ring with top-right gap (matches uploaded Orion logo) -->
  <!-- Center (120, 120), Radius 88, gap from -32 deg to +18 deg -->
  <path
    d="M 194.6 73.4 A 88 88 0 1 0 203.7 92.8"
    stroke="url(#orionRingGrad)"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#ringGlow)"
  />

  <!-- Specular glass inner highlight along the ring -->
  <path
    d="M 194.6 73.4 A 88 88 0 1 0 203.7 92.8"
    stroke="url(#orionRingHighlight)"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Bottom-left Blue Orion Star -->
  <circle cx="80" cy="158" r="10.5" fill="url(#blueStarSphere)" />

  <!-- Top-right Blue Orion Star -->
  <circle cx="160" cy="82" r="10.5" fill="url(#blueStarSphere)" />

  <!-- Center Champagne Gold Orion Star -->
  <circle cx="120" cy="120" r="15.5" fill="url(#goldStarSphere)" />
</svg>
